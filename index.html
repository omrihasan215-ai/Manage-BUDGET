<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול תקציב משפחתי</title>
    <!-- טעינת Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- טעינת Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- פונט עברית -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-4">

    <div class="max-w-4xl mx-auto p-2 md:p-6 space-y-6">
        <!-- כותרת ראשית ובורר חודשים -->
        <header class="bg-white rounded-2xl shadow-sm p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-900">ניהול תקציב משפחתי (ענן)</h1>
                <p class="text-sm text-gray-500">מעקב משותף בזמן אמת</p>
            </div>
            
            <div class="flex items-center gap-2 bg-gray-50 p-2 rounded-xl border border-gray-200">
                <span class="text-xs font-medium text-gray-600">חודש:</span>
                <input type="month" id="month-selector" class="bg-white border border-gray-200 rounded-lg px-3 py-1.5 text-sm font-medium text-indigo-900 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
        </header>

        <!-- סיכום מהיר -->
        <div class="grid grid-cols-3 gap-4 text-center">
            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100 shadow-sm">
                <span class="block text-xs text-emerald-600 font-medium">הכנסות החודש</span>
                <span id="total-income" class="text-lg md:text-xl font-bold text-emerald-700">₪0</span>
            </div>
            <div class="bg-rose-50 p-4 rounded-2xl border border-rose-100 shadow-sm">
                <span class="block text-xs text-rose-600 font-medium">הוצאות החודש</span>
                <span id="total-expense" class="text-lg md:text-xl font-bold text-rose-700">₪0</span>
            </div>
            <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 shadow-sm">
                <span class="block text-xs text-indigo-600 font-medium">יתרה לחודש</span>
                <span id="net-balance" class="text-lg md:text-xl font-bold text-indigo-700">₪0</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- טופס הוספת תנועה -->
            <div class="bg-white rounded-2xl shadow-sm p-6 md:col-span-1 h-fit">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">הוספת תנועה חדשה</h2>
                <form id="transaction-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">סוג תנועה</label>
                        <select id="type" class="w-full rounded-xl border border-gray-200 p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="expense">הוצאה</option>
                            <option value="income">הכנסה</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">תאריך</label>
                        <input type="date" id="date" required class="w-full rounded-xl border border-gray-200 p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">תיאור</label>
                        <input type="text" id="description" required placeholder="למשל: סופרמרקט, משכורת..." class="w-full rounded-xl border border-gray-200 p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">סכום (₪)</label>
                        <input type="number" id="amount" required min="1" placeholder="0" class="w-full rounded-xl border border-gray-200 p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">קטגוריה</label>
                        <select id="category" class="w-full rounded-xl border border-gray-200 p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="דיור">דיור ושכירות</option>
                            <option value="סופר">סופרמרקט ומזון</option>
                            <option value="חשבונות">חשבונות (חשמל, מים, ארנונה)</option>
                            <option value="תחבורה">תחבורה ורכב</option>
                            <option value="בילויים">בילויים ופנאי</option>
                            <option value="שונות">שונות / אחר</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition duration-200 text-sm shadow-sm">
                        הוסף לרשימה
                    </button>
                </form>
            </div>

            <!-- תצוגה -->
            <div class="bg-white rounded-2xl shadow-sm p-6 md:col-span-2 space-y-6">
                <div>
                    <h2 class="text-lg font-semibold mb-2 text-gray-700">התפלגות הוצאות לחודש הנבחר</h2>
                    <div class="relative w-full h-56 flex justify-center items-center">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>

                <div>
                    <h2 class="text-lg font-semibold mb-3 text-gray-700">פירוט תנועות לחודש</h2>
                    <div class="overflow-x-auto max-h-60 overflow-y-auto">
                        <table class="w-full text-right text-sm">
                            <thead class="bg-gray-50 text-gray-500 text-xs uppercase sticky top-0">
                                <tr>
                                    <th class="p-3">תאריך</th>
                                    <th class="p-3">תיאור</th>
                                    <th class="p-3">קטגוריה</th>
                                    <th class="p-3">סכום</th>
                                    <th class="p-3">פעולה</th>
                                </tr>
                            </thead>
                            <tbody id="transaction-list" class="divide-y divide-gray-100">
                                <!-- הנתונים יוזרמו לכאן -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- טעינת ספריות Firebase מתוך CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // החלף את הפרטים הבאים בנתונים מתוך ה-Firebase Console שלך!
        // ==========================================
        // ==========================================
        // החלף את הפרטים הבאים בנתונים מתוך ה-Firebase Console שלך!
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDH91igdJtT4S30myXdR3c-QDvuHXvaZjI",
            authDomain: "family-budget-88d70.firebaseapp.com",
            projectId: "family-budget-88d70",
            storageBucket: "family-budget-88d70.firebasestorage.app",
            messagingSenderId: "654098909587family-budget-88d70",
            appId: "1:654098909587:web:c0fc8a280c530acf750066"
        };

        // אתחול Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let transactions = [];
        let expenseChart = null;

        const form = document.getElementById('transaction-form');
        const descInput = document.getElementById('description');
        const amountInput = document.getElementById('amount');
        const typeInput = document.getElementById('type');
        const categoryInput = document.getElementById('category');
        const dateInput = document.getElementById('date');
        const monthSelector = document.getElementById('month-selector');
        
        const listEl = document.getElementById('transaction-list');
        const totalIncomeEl = document.getElementById('total-income');
        const totalExpenseEl = document.getElementById('total-expense');
        const netBalanceEl = document.getElementById('net-balance');

        // תאריך נוכחי וחודש נוכחי כברירת מחדל
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
        monthSelector.value = today.substring(0, 7);

        monthSelector.addEventListener('change', render);

        // האזנה בזמן אמת לשינויים בבסיס הנתונים (Firestore)
        onSnapshot(collection(db, "transactions"), (snapshot) => {
            transactions = [];
            snapshot.forEach((docSnap) => {
                transactions.push({
                    id: docSnap.id,
                    ...docSnap.data()
                });
            });
            render();
        });

        // הוספת תנועה חדשה לענן
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newTransaction = {
                date: dateInput.value,
                description: descInput.value,
                amount: parseFloat(amountInput.value),
                type: typeInput.value,
                category: categoryInput.value,
                createdAt: Date.now()
            };

            try {
                await addDoc(collection(db, "transactions"), newTransaction);
                descInput.value = '';
                amountInput.value = '';
            } catch (error) {
                console.error("שגיאה בהוספת תנועה: ", error);
                alert("שגיאה בהוספת הנתון לענן.");
            }
        });

        // מחיקת תנועה מהענן
        window.deleteTransaction = async function(id) {
            try {
                await deleteDoc(doc(db, "transactions", id));
            } catch (error) {
                console.error("שגיאה במחיקת תנועה: ", error);
            }
        }

        function render() {
            listEl.innerHTML = '';
            let totalIncome = 0;
            let totalExpense = 0;
            let categoryTotals = { 'דיור': 0, 'סופר': 0, 'חשבונות': 0, 'תחבורה': 0, 'בילויים': 0, 'שונות': 0 };

            const selectedMonth = monthSelector.value;

            const filteredTransactions = transactions.filter(t => {
                if (!t.date) return false;
                return t.date.startsWith(selectedMonth);
            });

            filteredTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));

            filteredTransactions.forEach(t => {
                if (t.type === 'income') {
                    totalIncome += t.amount;
                } else {
                    totalExpense += t.amount;
                    if (categoryTotals[t.category] !== undefined) {
                        categoryTotals[t.category] += t.amount;
                    }
                }

                const formattedDate = t.date ? t.date.split('-').reverse().join('/') : '';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 text-gray-500 text-xs">${formattedDate}</td>
                    <td class="p-3 font-medium text-gray-800">${t.description}</td>
                    <td class="p-3 text-gray-500"><span class="bg-gray-100 px-2.5 py-1 rounded-lg text-xs">${t.category}</span></td>
                    <td class="p-3 font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">
                        ${t.type === 'income' ? '+' : '-'}₪${t.amount.toLocaleString()}
                    </td>
                    <td class="p-3">
                        <button onclick="deleteTransaction('${t.id}')" class="text-gray-400 hover:text-rose-600 text-xs">מחק</button>
                    </td>
                `;
                listEl.appendChild(tr);
            });

            totalIncomeEl.innerText = `₪${totalIncome.toLocaleString()}`;
            totalExpenseEl.innerText = `₪${totalExpense.toLocaleString()}`;
            const net = totalIncome - totalExpense;
            netBalanceEl.innerText = `₪${net.toLocaleString()}`;
            netBalanceEl.className = `text-lg md:text-xl font-bold ${net >= 0 ? 'text-indigo-700' : 'text-rose-700'}`;

            updateChart(categoryTotals);
        }

        function updateChart(categoryTotals) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const dataValues = Object.values(categoryTotals);
            const hasData = dataValues.some(val => val > 0);

            if (expenseChart) {
                expenseChart.destroy();
            }

            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(categoryTotals),
                    datasets: [{
                        data: hasData ? dataValues : [1],
                        backgroundColor: hasData ? [
                            '#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6'
                        ] : ['#e5e7eb'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { family: 'Heebo', size: 11 },
                                boxWidth: 10
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
